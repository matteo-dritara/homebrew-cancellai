repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--strict]
        files: ^(cancellai\.py|scripts/gen_docs\.py)$

  - repo: local
    hooks:
      - id: gen-docs-check
        name: docs/CLI.md matches the CLI
        entry: python3 scripts/gen_docs.py --check
        language: system
        files: ^(cancellai\.py|scripts/gen_docs\.py|docs/CLI\.md)$
        pass_filenames: false
