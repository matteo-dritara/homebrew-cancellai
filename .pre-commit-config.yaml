repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--strict]
        files: ^(cancellai\.py|scripts/(gen_docs|project_os|check_docs|check_workflows|check_process|release|check_fixtures|check_schemas|characterize|diff_harness)\.py)$

  - repo: local
    hooks:
      - id: gen-docs-check
        name: docs/CLI.md matches the current Python CLI
        entry: python3 scripts/gen_docs.py --check
        language: system
        files: ^(cancellai\.py|scripts/gen_docs\.py|docs/CLI\.md)$
        pass_filenames: false

      - id: project-os-check
        name: project control plane is valid and generated docs are current
        entry: python3 scripts/project_os.py check
        language: system
        files: ^(project/|docs/(DECISION_REGISTER|ROADMAP|BACKLOG)\.md|scripts/project_os\.py|docs/security/SAFETY_INVARIANTS\.md)
        pass_filenames: false

      - id: docs-check
        name: local documentation links and invariant IDs are valid
        entry: python3 scripts/check_docs.py check
        language: system
        files: ^(.*\.md|scripts/check_docs\.py)$
        pass_filenames: false

      - id: workflow-policy-check
        name: GitHub Actions are least-privilege and immutable-pinned
        entry: python3 scripts/check_workflows.py check
        language: system
        files: ^(.github/workflows/.*\.ya?ml|scripts/check_workflows\.py)$
        pass_filenames: false

      - id: fixtures-check
        name: synthetic fixture corpus covers required categories and leaks nothing real
        entry: python3 scripts/check_fixtures.py check
        language: system
        files: ^(tests/fixtures/.*|scripts/check_fixtures\.py)$
        pass_filenames: false

      - id: schemas-check
        name: JSON document contracts match their golden documents
        entry: python3 scripts/check_schemas.py check
        language: system
        files: ^(docs/architecture/JSON_CONTRACTS\.md|tests/fixtures/schemas/.*|scripts/check_schemas\.py)$
        pass_filenames: false

      - id: characterization-check
        name: Python reference behavior on the fixture corpus is reproducible and reviewed
        entry: python3 scripts/characterize.py check
        language: system
        files: ^(cancellai\.py|tests/fixtures/(manifest\.json|recipes\.py|characterization/.*)|scripts/(characterize|check_fixtures)\.py)$
        pass_filenames: false

      - id: diff-harness-selftest
        name: differential comparison harness self-test
        entry: python3 scripts/diff_harness.py check
        language: system
        files: ^(scripts/diff_harness\.py|tests/fixtures/schemas/golden/.*|docs/development/VERIFICATION_STRATEGY\.md)$
        pass_filenames: false

      - id: process-check
        name: ADR lifecycle, decision supersession, evidence and generated banners
        entry: python3 scripts/check_process.py check
        language: system
        files: ^(docs/adrs/|project/|scripts/check_process\.py|docs/(DECISION_REGISTER|ROADMAP|BACKLOG|CLI)\.md)
        pass_filenames: false

      - id: release-consistency
        name: versions agree and every closed epic has a release
        entry: python3 scripts/release.py check
        language: system
        files: ^(cancellai\.py|pyproject\.toml|CHANGELOG\.md|Formula/|project/(epics/|roadmap\.json|evidence/RELEASE-)|scripts/release\.py)
        pass_filenames: false

      - id: conventional-commit
        name: commit message follows Conventional Commits
        entry: python3 scripts/check_process.py commit-msg
        language: system
        stages: [commit-msg]
