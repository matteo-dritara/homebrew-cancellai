[workspace]
# Resolver 3 (Cargo 1.84+, well below the version declared below) is MSRV-aware: it will not pick a
# dependency version whose own `rust-version` is above ours. Resolver 2 does not look at
# `rust-version` at all, which is how a routine `cargo update` put `instability 0.3.13` and
# `darling 0.24.1` - both requiring rustc 1.88 - into the lock file and broke the MSRV job on all
# three platforms while every stable job stayed green (E09-S05).
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.21.0"
edition = "2024"
# Raised from 1.85.0 by ADR-0026 (E17-S08). 1.85 was the minimum edition 2024 requires and was
# never chosen on its own merits; holding it kept `ratatui 0.29` and with it an open advisory in
# `lru`, an accepted `cargo deny` ignore for an unmaintained `paste`, and a ban on let-chains in
# this workspace's own source.
rust-version = "1.88.0"
license = "MIT"
publish = false

# Centralized so every crate that needs serde uses the same version - a version drift
# between workspace members is exactly the "multiple-versions" noise rust/deny.toml warns
# about (E02-S02). Both are MIT OR Apache-2.0, already on the ADR-0015 license allow-list.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Provider-adapter protected-name comparison (cancellai-provider-api::protection, E05-S03)
# needs real NFD decomposition to match cancellai.py's canonical_name - MIT OR Apache-2.0, on
# the ADR-0015 license allow-list.
unicode-normalization = "0.1"
# ADR-0019/E22-S03: outer-ring dependency, named in the ADR itself - replaces cancellai-cli's
# hand-rolled argument parser. MIT OR Apache-2.0, already on the ADR-0015 allow-list. Not a
# kernel-ring crate (cancellai-model/cancellai-safety/cancellai-platform/cancellai-sealedfs)
# dependency - it stays out of those crates' Cargo.toml entirely.
clap = { version = "4", features = ["derive"] }

# ADR-0015: unsafe is forbidden workspace-wide by default. A future crate that genuinely
# needs it (e.g. OS-specific identity/reparse-point handling in cancellai-platform, E07)
# overrides this locally with an explicit, reviewed justification - it is never removed here.
[workspace.lints.rust]
unsafe_code = "forbid"
# `unsafe fn` does not make its body an implicit unsafe block. Requiring the block makes each
# unsafe operation inside one visible to `undocumented_unsafe_blocks` below, instead of hiding a
# whole function's worth of them behind one signature.
unsafe_op_in_unsafe_fn = "deny"

# Until now this workspace configured no clippy lint at all: `cargo clippy -D warnings` ran the
# default set and nothing else. For a project whose thesis is that a tool deleting files must
# never act on an unproven assumption, the lints below are the ones that state that thesis in a
# form the compiler checks. They are denied in production and allowed in tests (`clippy.toml`) -
# a test that unwraps is asserting, production code that unwraps is choosing to abort mid-work.
#
# `expect_used` is deliberately absent. `CString::new("/").expect("literal has no embedded NUL")`
# is the correct idiom for an invariant that holds by construction, and denying it pushes authors
# toward silently swallowing the case instead of naming why it cannot happen.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
indexing_slicing = "deny"
