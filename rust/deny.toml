# cargo-deny configuration (E02-S02, ADR-0015).
#
# `cargo deny check` runs all four sections below. `advisories` is this workspace's RustSec
# gate - a separate cargo-audit invocation is redundant with it (both read the RustSec
# Advisory Database) and is not used here.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# RustSec advisory database.
[advisories]
ignore = [
    # RUSTSEC-2024-0436: `paste` (a compile-time-only proc-macro, no runtime code shipped) is
    # archived/unmaintained upstream. Pulled in transitively and non-optionally by ratatui
    # 0.29 (E09-S01, ADR-0019's outer-ring TUI dependency) - the newest ratatui line this
    # workspace's MSRV (1.85.0, ADR-0015) can build against, since ratatui 0.30 raises its own
    # rust-version to 1.88.0. This is RustSec's "unmaintained" category, not a vulnerability
    # advisory, and there is no ratatui alternative or vendoring option that removes it without
    # either bumping MSRV workspace-wide (a separate, dedicated ADR-0015 decision) or forking
    # `paste`. Revisit when ratatui drops the dependency upstream or this workspace's MSRV
    # moves to >=1.88.0.
    "RUSTSEC-2024-0436",
]

# ADR-0015: strict permissive allow-list. Anything not listed here - including weak
# copyleft (MPL-2.0) and strong copyleft (GPL-*, LGPL-*, AGPL-*) - is denied by default.
# Widening this list is its own reviewed decision, not a default a dependency can quietly
# rely on.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates are all `publish = false` (rust/Cargo.toml); their own license does not
# need checking here, only their dependencies' do.
ignore = true

[bans]
# A "*" version requirement pins nothing and lets a dependency update silently change what
# ships; this workspace has no such requirement today and should not gain one by accident.
wildcards = "deny"
multiple-versions = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
deny = []
skip = []
skip-tree = []

# AC: unknown registries/git sources are denied unless explicitly approved. Every dependency
# comes from crates.io until a specific registry or git source is added to the allow-lists
# below with a reason.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
