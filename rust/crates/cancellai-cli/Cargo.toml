[package]
name = "cancellai-cli"
description = "Headless/scriptable CLI client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# E06-S09: named pause points on `clean`'s mutation path for the kill harness
# (`src/kill_points.rs`, `tests/kill_harness.rs`). Never enabled in a release build.
kill-points = []
# E33-S01: lets tests point `containment refresh` at a fake curl through CANCELLAI_TEST_CURL.
# Never enabled in a release build, which only runs the system curl at its fixed location.
test-curl = []

[dependencies]
cancellai-model = { path = "../cancellai-model", version = "2.0.0" }
cancellai-safety = { path = "../cancellai-safety", version = "2.0.0" }
cancellai-inventory = { path = "../cancellai-inventory", version = "2.0.0" }
cancellai-policy = { path = "../cancellai-policy", version = "2.0.0" }
cancellai-provider-api = { path = "../cancellai-provider-api", version = "2.0.0" }
cancellai-provider-claude = { path = "../cancellai-provider-claude", version = "2.0.0" }
cancellai-provider-codex = { path = "../cancellai-provider-codex", version = "2.0.0" }
cancellai-store = { path = "../cancellai-store", version = "2.0.0" }
cancellai-platform = { path = "../cancellai-platform", version = "2.0.0" }
cancellai-sealedfs = { path = "../cancellai-sealedfs", version = "2.0.0" }
cancellai-desktop-api = { path = "../cancellai-desktop-api", version = "2.0.0" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
# E06-S07: the containment integration tests sign synthetic notices with a key generated in the
# test and trusted only through a temporary owner trust file - no test key ships in any build.
# Same versions and features the safety kernel already resolves.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
sha2 = { version = "0.11.0", default-features = false }
# E33-S03: the containment tests read the ledger's rows and plant corrupt or unverifiable ones.
# Same version and features `cancellai-store` resolves, so no new code enters the build.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# E19-S02: the view-model parity test builds the dashboard view from this binary's own API.
cancellai-desktop = { path = "../cancellai-desktop", version = "2.0.0" }
