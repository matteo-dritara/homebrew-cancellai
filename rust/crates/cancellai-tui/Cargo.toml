[package]
name = "cancellai-tui"
description = "Terminal (Atlas) experience client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# E09-S01: no cancellai-* dependency yet, deliberately - this story is the shell/navigation
# layer only and has no data source to render (docs/architecture/TARGET.md "Atlas TUI shell
# (E09-S01)"). AC1 ("No direct filesystem/provider access from the TUI crate") is enforced
# concretely by this crate depending on neither a provider adapter nor cancellai-inventory/
# cancellai-platform/cancellai-store at all. E09-S02 reintroduces cancellai-policy once it has
# real fixture-inventory view data to feed the Atlas screen this story only stubs.
#
# ratatui/crossterm are outer-ring dependencies named explicitly for this epic in ADR-0019
# ("Dependency rings - the kernel stays bare, the outer ring uses reviewed libraries"): both
# MIT-licensed, already on rust/deny.toml's allow-list, replacing what would otherwise be a
# hand-rolled ANSI terminal renderer and raw-mode/input handling loop.
[dependencies]
ratatui = "0.29"
crossterm = "0.28"
