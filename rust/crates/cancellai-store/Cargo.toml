[package]
name = "cancellai-store"
description = "SQLite current-state store, event ledger, and analytical rollups."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cancellai-model = { path = "../cancellai-model", version = "0.1.0" }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde_json = { workspace = true }
# E13-S02: the event ledger's compaction summary digest (ADR-0019's outer-ring criteria - MIT
# OR Apache-2.0, already on the `rust/deny.toml` allow-list via `cancellai-platform`/
# `cancellai-safety`'s own use; makes no authority/identity/mutation decision here, it only
# hashes an already-written audit record). `default-features = false` to match those crates'
# own pin.
sha2 = { version = "0.11.0", default-features = false }
