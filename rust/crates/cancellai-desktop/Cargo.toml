[package]
name = "cancellai-desktop"
description = "Optional desktop dashboard: a read-only client of the desktop API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Outer ring (ADR-0019), and a client of the engine rather than part of it (ADR-0038): the only
# cancellai crate it depends on is cancellai-desktop-api, so it can reach the engine only through
# that versioned, read-only channel - never a provider root, the policy crate, or the mutation
# executor. No UI toolkit: the dashboard is HTML served on loopback to the system browser
# (ADR-0038 records why Tauri and eframe were not adopted).
[dependencies]
cancellai-desktop-api = { path = "../cancellai-desktop-api", version = "1.21.1" }
serde_json = { workspace = true }
