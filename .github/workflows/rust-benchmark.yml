name: rust-benchmark

# E04-S04: the heavy 10k/100k(/1M-on-demand)-entry cancellai-inventory benchmarks
# (rust/crates/cancellai-inventory/tests/performance_scheduled.rs) are `#[ignore]`d out of
# the normal `cargo test` run (.github/workflows/rust.yml) so every PR stays fast. This
# workflow runs them on a schedule instead, and uploads the machine-readable trend artifact
# docs/development/RELEASE_GATES.md's "benchmark summary" release-evidence item references.
#
# E21-S05: those benchmarks measure `scan_scope`, which ADR-0018 keeps as the reference
# implementation of scan completeness but which the shipped binary does not call - the
# 2026-09-03 review (CR-TE-02) found the performance gate pointed at unreachable code. The
# shipped discovery path (`resolve_claude`/`resolve_codex`, exactly what `cancellai-cli`
# invokes) is now measured too, by `cancellai-cli/tests/performance_shipped_path.rs`. That one
# is deliberately *not* `#[ignore]`d - it is small enough to run on every PR, because a
# regression on the path users actually execute should not wait a week to surface.

on:
  schedule:
    # Weekly, not per-PR - a benchmark regression from one commit is still visible within a
    # week, and a shared CI runner should not absorb this cost on every push.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      sizes:
        description: "Comma-separated dataset sizes to benchmark"
        required: false
        default: "10000,100000"

permissions:
  contents: read

jobs:
  # E27-S06: Miri executes the crates it can reach and reports undefined behaviour the compiler
  # cannot see. Weekly rather than per-PR for the same reason as the benchmark above: `tui` alone
  # takes over five minutes under the interpreter, and a UB regression introduced on Monday is
  # still worth finding on Monday. The workspace inventory below is deliberate: a crate may be
  # executable, or explicitly excluded for a named Miri limitation, but it may not disappear from
  # the job when it is added or renamed.
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
          components: miri
      - name: undefined-behaviour check on the crates Miri can execute
        working-directory: rust
        env:
          # Tests use synthetic trees, but need filesystem access. TUI fixture values deliberately
          # use `Box::leak` to borrow them for the test lifetime, so leak reporting is not useful
          # here; these flags do not disable Miri's invalid-value or aliasing/provenance checks.
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-ignore-leaks
        run: |
          set -euo pipefail
          executable=(
            cancellai-model
            cancellai-inventory
            cancellai-provider-api
            cancellai-provider-claude
            cancellai-guardian
            cancellai-tui
          )
          excluded=(
            cancellai-cli
            cancellai-platform
            cancellai-sealedfs
            cancellai-policy
            cancellai-provider-codex
            cancellai-safety
            # cancellai-store: rusqlite's `bundled` feature links compiled SQLite C source;
            # Connection::open(_in_memory) calls sqlite3_threadsafe(), a foreign function Miri
            # has no shim for (discovered 2026-09-21, when budget.rs's ledger-budget test first
            # exercised a real Connection under this job).
            cancellai-store
          )
          expected="$(printf '%s\n' "${executable[@]}" "${excluded[@]}" | sort)"
          actual="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(*sorted(package["name"] for package in json.load(sys.stdin)["packages"]), sep="\n")')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Miri workspace inventory is stale; classify every added or renamed crate."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          for crate in "${executable[@]}"; do
            echo "::group::miri $crate"
            if [[ "$crate" == "cancellai-inventory" ]]; then
              # The ten-second threshold measures native performance, not correctness under an
              # interpreter; its functional tests still run.
              cargo +nightly miri test -p "$crate" -- --skip scan_scope_completes_within_budget_for_a_small_dataset
            else
              cargo +nightly miri test -p "$crate"
            fi
            echo "::endgroup::"
          done

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Run the per-PR shipped-path performance gate
        working-directory: rust
        run: cargo test --release -p cancellai-cli --test performance_shipped_path -- --nocapture
      - name: Run the shipped-path heavy benchmarks (primary trend)
        working-directory: rust
        env:
          CANCELLAI_BENCH_SIZES: ${{ github.event.inputs.sizes || '10000,100000' }}
          CANCELLAI_BENCH_OUTPUT: ${{ github.workspace }}/rust-shipped-path-bench.json
        run: cargo test --release -p cancellai-cli --test performance_scheduled_shipped -- --ignored --nocapture
      - name: Run cancellai-inventory heavy benchmarks (crate-contract guard)
        working-directory: rust
        env:
          CANCELLAI_BENCH_SIZES: ${{ github.event.inputs.sizes || '10000,100000' }}
          CANCELLAI_BENCH_OUTPUT: ${{ github.workspace }}/rust-inventory-bench.json
        run: cargo test --release -p cancellai-inventory --test performance_scheduled -- --ignored --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-shipped-path-bench-trend
          path: rust-shipped-path-bench.json
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-inventory-bench-trend
          path: rust-inventory-bench.json
          retention-days: 90
