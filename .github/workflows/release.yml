name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    # Re-run every gate at the tagged commit. A release verified against whatever `main`
    # looked like afterwards is not evidence about the artifact users install.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m pytest tests -v
      - run: python3 -m ruff check .
      - run: python3 -m ruff format --check .
      - run: python3 -m mypy cancellai.py scripts/gen_docs.py scripts/project_os.py scripts/check_docs.py scripts/check_workflows.py scripts/check_process.py scripts/release.py
      - run: python3 scripts/gen_docs.py --check
      - run: python3 scripts/project_os.py check
      - run: python3 scripts/check_docs.py check
      - run: python3 scripts/check_workflows.py check
      - run: python3 scripts/check_process.py check
      - name: the tag must match the version in the source
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          source_version="$(python3 cancellai.py version)"
          if [ "$tag" != "$source_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $source_version" >&2
            exit 1
          fi
      - name: the release evidence packet must exist
        run: test -f "project/evidence/RELEASE-${GITHUB_REF_NAME}.md"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: checksum of the archive GitHub generates from this tag
        id: archive
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o archive.tar.gz "$url"
          digest="$(shasum -a 256 archive.tar.gz | cut -d' ' -f1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "Formula sha256 for ${GITHUB_REF_NAME}: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: publish the release from the committed evidence packet
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          {
            cat "project/evidence/RELEASE-${GITHUB_REF_NAME}.md"
            printf '\n---\n\nArchive SHA-256: `%s`\n' "$SHA256"
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            --title "cancellAI ${GITHUB_REF_NAME}" \
            --notes-file "$notes" \
            --verify-tag
