name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    # Re-run every gate at the tagged commit. A release verified against whatever `main`
    # looked like afterwards is not evidence about the artifact users install.
    #
    # This must stay in lockstep with the pre-commit local-hook gate set
    # (.pre-commit-config.yaml) and with rust.yml's `quality` job: scripts/check_workflows.py
    # fails the build if either one adds a gate this job does not also run (E22-S01,
    # regression guard for CR-TE-06 / the v1.8.0 incident recorded in
    # project/evidence/RELEASE-v1.8.0.md, where this job reported success while `rust /
    # quality (windows-latest)` was failing on the same commit).
    runs-on: macos-latest
    steps:
      # fetch-depth: 0 (full history) is required, not cosmetic: check_platforms.py's
      # ancestor check (`git merge-base --is-ancestor <verified_commit> HEAD`) needs the
      # verified_commit object to exist locally at all. The default shallow checkout (depth 1)
      # only fetches the tagged commit itself, so an older verified_commit is not merely
      # unreachable - it is absent - and the check fails with "fatal: Not a valid commit name"
      # instead of validating provenance (E23-S01; this is what broke the v1.10.0 tag, release
      # run 34252829459).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m pytest tests -v
      - run: python3 -m ruff check .
      - run: python3 -m ruff format --check .
      - run: python3 -m mypy cancellai.py scripts/gen_docs.py scripts/project_os.py scripts/check_docs.py scripts/check_workflows.py scripts/check_fixtures.py scripts/check_schemas.py scripts/characterize.py scripts/diff_harness.py scripts/check_rust_workspace.py scripts/check_mutation_boundary.py scripts/check_provider_compatibility.py scripts/check_platforms.py scripts/rust_python_parity.py scripts/release_manifest.py
      - run: python3 scripts/gen_docs.py --check
      - run: python3 scripts/project_os.py check
      - run: python3 scripts/check_docs.py check
      - run: python3 scripts/check_workflows.py check
      - run: python3 scripts/check_fixtures.py check
      - run: python3 scripts/check_schemas.py check
      - run: python3 scripts/characterize.py check
      - run: python3 scripts/diff_harness.py check
      - run: python3 scripts/check_rust_workspace.py check
      - run: python3 scripts/check_mutation_boundary.py check
      - run: python3 scripts/check_provider_compatibility.py check
      - run: python3 scripts/check_platforms.py check
      - run: python3 scripts/rust_python_parity.py self-test
      - run: python3 scripts/rust_python_parity.py check
      - run: python3 scripts/check_process.py check
      - run: python3 scripts/release.py check
      - run: python3 scripts/release_manifest.py check
      - name: the tag must match the version in the source
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          source_version="$(python3 cancellai.py version)"
          if [ "$tag" != "$source_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $source_version" >&2
            exit 1
          fi
      - name: the release evidence packet must exist
        run: test -f "project/evidence/RELEASE-${GITHUB_REF_NAME}.md"

  # Mirrors rust.yml's `quality` job (ADR-0015): the tagged commit must face the same
  # fmt/clippy/test/deny gate the pre-merge workflow already runs on all three tier-1
  # platforms, per-platform, because CR-TE-06 was exactly this job missing entirely - a
  # Windows-only clippy failure at the tag went unreported (v1.8.0, see the `verify` job's
  # comment above).
  verify-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: rust
      - run: cargo test --workspace
        working-directory: rust
      - run: cargo install cargo-deny@0.20.2 --locked
      - run: cargo deny check
        working-directory: rust

  # E17-S02 / ADR-0021: canonical tier-1 cross-platform build (docs/PLATFORMS.md's matrix)
  # produced from the tagged commit, not merely checked/tested against it. Each leg packages
  # its own archive and proves the packaged binary actually runs on the platform that built it
  # (the "installer smoke test" the story's verification contract names) before anything is
  # uploaded.
  build-artifacts:
    needs: [verify, verify-rust]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # CANCELLAI_CHANNEL is read at compile time (option_env!, cancellai-safety::BuildChannel)
      # and baked permanently into the binary - it is not a runtime override a user could set
      # (E17-S05, SI-030). No production code path calls BuildChannel::from_compiled_env() yet
      # (cancellai-cli's own classification pipeline is not wired to it until E06-S04, the
      # cutover story - see docs/security/SUPPLY_CHAIN.md's "Release channels" section for why),
      # so this is currently inert; set here so the release pipeline already records the correct
      # value for whenever a caller consumes it, rather than needing to remember to add it later.
      - run: cargo build --release --locked -p cancellai-cli --target ${{ matrix.target }}
        working-directory: rust
        env:
          CANCELLAI_CHANNEL: stable
      - name: package the archive and its checksum, then smoke-test the packaged binary
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="cancellai-cli-${version}-${{ matrix.target }}"
          staging="dist/${name}"
          mkdir -p "$staging"
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="rust/target/${{ matrix.target }}/release/cancellai-cli.exe"
          else
            bin="rust/target/${{ matrix.target }}/release/cancellai-cli"
          fi
          cp "$bin" "$staging/"
          # Prove the packaged artifact actually executes on the platform that built it, not
          # merely that it compiled - this is the story's "installer smoke test".
          if [ "${{ runner.os }}" = "Windows" ]; then
            "./${staging}/cancellai-cli.exe" version
          else
            chmod +x "${staging}/cancellai-cli"
            "./${staging}/cancellai-cli" version
          fi
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="${name}.zip"
            7z a "$archive" "$name" >/dev/null
          else
            archive="${name}.tar.gz"
            tar czf "$archive" "$name"
          fi
          python3 -c "
          import hashlib, sys
          data = open(sys.argv[1], 'rb').read()
          open(sys.argv[1] + '.sha256', 'w').write(hashlib.sha256(data).hexdigest() + '\n')
          " "$archive"
          echo "ARCHIVE_NAME=$archive" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"
      # E17-S03: a CycloneDX SBOM for exactly what this leg compiled - built with --target so
      # target-conditional dependencies (e.g. windows-sys, Windows-only) are reflected
      # accurately rather than approximated from the host toolchain alone.
      - name: generate the CycloneDX SBOM for this target
        working-directory: rust
        run: |
          cargo install cargo-cyclonedx@0.5.9 --locked
          cargo cyclonedx --manifest-path crates/cancellai-cli/Cargo.toml \
            --describe binaries --format json --spec-version 1.5 \
            --target ${{ matrix.target }}
      - name: move the SBOM alongside its archive
        shell: bash
        run: mv rust/crates/cancellai-cli/cancellai-cli_bin.cdx.json "dist/${{ env.NAME }}.cdx.json"
      # Provenance: signed, verifiable proof of repository/workflow/commit origin (AC1) -
      # gh attestation verify's default predicate type is exactly this action's output.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.ARCHIVE_NAME }}
      # actions/attest-sbom is deprecated in favor of the generic actions/attest with
      # sbom-path (confirmed from actions/attest-sbom's own action.yml, which now emits
      # "please use actions/attest instead" - checked directly via `gh api`, not assumed) -
      # AC2: SBOM attested for this canonical build (this target's archive).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.ARCHIVE_NAME }}
          sbom-path: dist/${{ env.NAME }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact-${{ matrix.target }}
          path: |
            dist/${{ env.ARCHIVE_NAME }}
            dist/${{ env.ARCHIVE_NAME }}.sha256
            dist/${{ env.NAME }}.cdx.json
          if-no-files-found: error

  # Assembles E17-S01's release manifest contract (project/schemas/release_manifest.schema.json)
  # from the artifacts build-artifacts just produced - real checksums of real files, not typed
  # by hand.
  release-manifest-generate:
    needs: [verify, verify-rust, build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-artifact-*
          path: dist
          merge-multiple: true
      - name: build the release manifest (E17-S01 contract)
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Every "v*" tag today is a stable release; no beta/nightly tag scheme exists yet
          # (that is E17-S05's concern, once one does).
          python3 scripts/release_manifest.py generate \
            --version "$version" \
            --channel stable \
            --source-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --run-id "$GITHUB_RUN_ID" \
            --knowledge-min 1 --knowledge-max 1 \
            --artifact "cancellai-cli-${version}-aarch64-apple-darwin" aarch64-apple-darwin "dist/cancellai-cli-${version}-aarch64-apple-darwin.tar.gz" \
            --artifact "cancellai-cli-${version}-x86_64-apple-darwin" x86_64-apple-darwin "dist/cancellai-cli-${version}-x86_64-apple-darwin.tar.gz" \
            --artifact "cancellai-cli-${version}-x86_64-unknown-linux-gnu" x86_64-unknown-linux-gnu "dist/cancellai-cli-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            --artifact "cancellai-cli-${version}-x86_64-pc-windows-msvc" x86_64-pc-windows-msvc "dist/cancellai-cli-${version}-x86_64-pc-windows-msvc.zip" \
            --out release-manifest.json
      - run: python3 scripts/release_manifest.py verify-checksums release-manifest.json dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error

  # E17-S03's own verification contract ("Automated attestation verification job"): re-fetch
  # and cryptographically verify every provenance and SBOM attestation build-artifacts created,
  # independent of the run that created them - a real check against GitHub's attestation API,
  # not a re-assertion that the earlier steps claimed success. AC3: publish depends on this job,
  # so a missing or invalid attestation fails the release rather than shipping silently.
  attestation-verify:
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
      id-token: none
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-artifact-*
          path: dist
          merge-multiple: true
      - name: verify build provenance for every canonical archive
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "no archives downloaded to verify" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done
      - name: verify the SBOM attestation for every canonical archive
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          for archive in "${archives[@]}"; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" --predicate-type https://cyclonedx.org/bom
          done

  publish:
    needs: [verify, verify-rust, build-artifacts, release-manifest-generate, attestation-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-artifact-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          path: .
      - name: refuse to publish if the manifest's checksums do not match the built artifacts
        run: python3 scripts/release_manifest.py verify-checksums release-manifest.json dist
      - name: checksum of the archive GitHub generates from this tag
        id: archive
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o archive.tar.gz "$url"
          digest="$(shasum -a 256 archive.tar.gz | cut -d' ' -f1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "Formula sha256 for ${GITHUB_REF_NAME}: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: publish the release from the committed evidence packet
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          {
            cat "project/evidence/RELEASE-${GITHUB_REF_NAME}.md"
            printf '\n---\n\nArchive SHA-256: `%s`\n' "$SHA256"
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            --title "cancellAI ${GITHUB_REF_NAME}" \
            --notes-file "$notes" \
            --verify-tag \
            dist/*.tar.gz dist/*.zip dist/*.sha256 dist/*.cdx.json release-manifest.json
