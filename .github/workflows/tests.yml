name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m pytest tests -v

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m ruff check .
      - run: python3 -m ruff format --check .
      - run: python3 -m mypy cancellai.py scripts/gen_docs.py scripts/project_os.py scripts/check_docs.py scripts/check_workflows.py
      - run: python3 scripts/gen_docs.py --check
      - run: python3 scripts/project_os.py check
      - run: python3 scripts/check_docs.py check
      - run: python3 scripts/check_workflows.py check

  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `brew audit`/`brew style` only accept a tapped formula name, not a
      # bare path, so tap this checkout locally before checking it.
      - run: brew tap matteo-dritara/cancellai "$GITHUB_WORKSPACE"
      - run: brew audit --strict matteo-dritara/cancellai/cancellai
      - run: brew style matteo-dritara/cancellai/cancellai
