name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # fetch-depth: 0 (full history) is required, not cosmetic: check_risk_classification.py
          # attributes committed changes to the story that declared them, and against a depth-1
          # checkout `git log --name-only` reports the whole tree as the tip commit's diff - there
          # is no parent object to diff against. This gate then attributed all 539 tracked files to
          # the last commit's story and refused a kernel crate's CR4 floor for a story that touched
          # no Rust (run 34732117378). Same class as the v1.10.0 tag break recorded in release.yml's
          # `verify` job. The checker now refuses a shallow clone outright rather than guessing.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m pytest tests -v

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # fetch-depth: 0 (full history) is required, not cosmetic: check_risk_classification.py
          # attributes committed changes to the story that declared them, and against a depth-1
          # checkout `git log --name-only` reports the whole tree as the tip commit's diff - there
          # is no parent object to diff against. This gate then attributed all 539 tracked files to
          # the last commit's story and refused a kernel crate's CR4 floor for a story that touched
          # no Rust (run 34732117378). Same class as the v1.10.0 tag break recorded in release.yml's
          # `verify` job. The checker now refuses a shallow clone outright rather than guessing.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m ruff check .
      - run: python3 -m ruff format --check .
      - run: python3 -m mypy cancellai.py scripts/gen_docs.py scripts/project_os.py scripts/check_docs.py scripts/check_workflows.py scripts/check_process.py scripts/release.py scripts/check_fixtures.py scripts/check_schemas.py scripts/characterize.py scripts/diff_harness.py scripts/check_rust_workspace.py scripts/check_agent_skills.py scripts/process_metrics.py scripts/check_risk_classification.py scripts/check_agent_toolchain.py scripts/check_evidence.py scripts/check_ears.py scripts/safety_oracle.py scripts/gate_sensitivity.py scripts/cutover_benchmark.py scripts/review_round.py
      - run: python3 scripts/gen_docs.py --check
      - run: python3 scripts/project_os.py check
      - run: python3 scripts/check_docs.py check
      - run: python3 scripts/check_workflows.py check
      - run: python3 scripts/check_fixtures.py check
      - run: python3 scripts/check_schemas.py check
      - run: python3 scripts/characterize.py check
      - run: python3 scripts/diff_harness.py check
      - run: python3 scripts/check_rust_workspace.py check
      - run: python3 scripts/check_agent_skills.py check
      - run: python3 scripts/process_metrics.py check
      - run: python3 scripts/check_risk_classification.py check
      - run: python3 scripts/check_agent_toolchain.py check
      - run: python3 scripts/check_evidence.py check
      - run: python3 scripts/safety_oracle.py check
      - run: python3 scripts/check_ears.py check
      - run: python3 scripts/gate_sensitivity.py check

  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `brew audit`/`brew style` only accept a tapped formula name, not a
      # bare path, so tap this checkout locally before checking it.
      - run: brew tap matteo-dritara/cancellai "$GITHUB_WORKSPACE"
      - run: brew audit --strict matteo-dritara/cancellai/cancellai
      - run: brew style matteo-dritara/cancellai/cancellai
      # The live formula's engine digests (once it carries the engine) must be the ones its
      # release published (E06 review round 7).
      - run: python3 scripts/release.py verify-formula
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      # E06-S04: the cutover formula (the Rust engine as `cancellai`, Python as `cancellai-legacy`)
      # lives outside Formula/ until the release that adopts it. Install it for real from a
      # throwaway tap, built from this very commit - the engine candidate as a stable-channel
      # release build and the source as `git archive` - and require both commands to report this
      # version exactly and the formula's own `brew test` to pass (E06 review rounds 6-7).
      - name: the cutover formula installs and runs this commit's engine
        run: |
          set -euo pipefail
          version="$(python3 cancellai.py version)"
          work="$RUNNER_TEMP/cutover"
          mkdir -p "$work/tap/Formula" "$work/engine/cancellai-cli-$version-aarch64-apple-darwin"
          (cd rust && CANCELLAI_CHANNEL=stable cargo build --release -p cancellai-cli --target-dir "$work/target")
          cp "$work/target/release/cancellai-cli" "$work/engine/cancellai-cli-$version-aarch64-apple-darwin/"
          tar -C "$work/engine" -czf "$work/cancellai-cli-$version-aarch64-apple-darwin.tar.gz" "cancellai-cli-$version-aarch64-apple-darwin"
          git archive --prefix="cancellai-$version/" -o "$work/cancellai-$version.tar.gz" HEAD
          python3 scripts/release.py render-local-cutover --version "$version" \
            --source-archive "$work/cancellai-$version.tar.gz" \
            --engine-archive "$work/cancellai-cli-$version-aarch64-apple-darwin.tar.gz" \
            > "$work/tap/Formula/cancellai.rb"
          git -C "$work/tap" init -q
          git -C "$work/tap" add -A
          git -C "$work/tap" -c user.name=ci -c user.email=ci@example.invalid commit -qm cutover
          brew tap cancellai-ci/cutover "$work/tap"
          brew style cancellai-ci/cutover/cancellai
          HOMEBREW_NO_INSTALL_FROM_API=1 brew install cancellai-ci/cutover/cancellai
          python3 scripts/release.py verify-installed --version "$version" --prefix "$(brew --prefix)"
          brew test cancellai-ci/cutover/cancellai
