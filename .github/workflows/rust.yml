name: rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        # MSRV (ADR-0015) and current stable, so a regression against either surfaces here
        # rather than only once a later epic happens to build against the other.
        rust: ["1.88.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo check --workspace --all-targets
        working-directory: rust

  # E02-S02 / ADR-0015: fmt, clippy (denied warnings), tests, and cargo-deny (licenses,
  # bans, sources, RustSec advisories) on all three platforms, not just the toolchain check
  # above - a platform-specific lint or a dependency issue should surface here, not only
  # once E07 turns on real per-platform code.
  # E27-S02: coverage is a ratchet, not a target - it fails when a crate covers less than it
  # already did. One platform is enough (region coverage is not platform-specific for these
  # crates) and Linux is the cheapest, so this is its own job rather than a fourth step in the
  # three-OS `quality` matrix: `cargo llvm-cov` has to be installed and a full instrumented
  # rebuild is not worth paying for three times.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned exactly, on both sides. Region counting depends on the compiler that emitted the
      # instrumentation, so a baseline measured against a moving `stable` is a number that can only
      # be compared with itself - which is what this job reported the first time it checked its own
      # provenance (E27-S07).
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.1"
          components: llvm-tools-preview
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: cargo install cargo-llvm-cov@0.9.0 --locked
      - run: python3 scripts/check_coverage.py check

  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: rust
      - run: cargo test --workspace
        working-directory: rust
      # E02 verifier review round 1 (E02-S02): the EmbarkStudios/cargo-deny-action this
      # replaced declares `runs.using: docker`, and GitHub only runs Docker container
      # actions on Linux runners - macOS/Windows would fail before cargo-deny ever ran.
      # `cargo install` is portable across all three matrix OSes.
      - run: cargo install cargo-deny@0.20.2 --locked
      - run: cargo deny check
        working-directory: rust
